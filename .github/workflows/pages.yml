# Publica a versão web no GitHub Pages a cada push para main.
# iPhones e amigos sem a app jogam em https://sr-ssss.github.io/NOB/
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # chave "publishable" do Supabase: é pública por natureza (também vai dentro do APK)
      VITE_SUPABASE_URL: https://rbuaprrmspytpsbiyimg.supabase.co
      VITE_SUPABASE_KEY: sb_publishable_rgNPBOMjSwpge9LMx0RzMQ_DdLet1G2
      VITE_LINK_JOGAR: https://sr-ssss.github.io/NOB/
      VITE_GIPHY_KEY: c0N7wRTJ7zpMrKt0ctKJmoIMuL34h9vL
      # Se Vira!: chave grátis da Pexels (pexels.com/api). Vazia = imagens automáticas só da GIPHY
      VITE_PEXELS_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
