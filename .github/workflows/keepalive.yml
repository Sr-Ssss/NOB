# Mantém o projeto Supabase (plano grátis) acordado: sem atividade durante 7 dias, a Supabase pausa-o
# e a app deixa de ligar. Duas vezes por semana faz uma leitura pequena à base de dados.
# Precisa da tabela `keepalive` (SQL em info/auditoria/burocracia-playstore.md → Keep-alive).
# Se falhar, o GitHub manda e-mail ao dono do repositório.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 * * 1,4' # segundas e quintas, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      # chave "publishable" do Supabase: é pública por natureza (a mesma do pages.yml e do APK)
      SUPABASE_URL: https://rbuaprrmspytpsbiyimg.supabase.co
      SUPABASE_KEY: sb_publishable_rgNPBOMjSwpge9LMx0RzMQ_DdLet1G2
    steps:
      - name: Ler a tabela keepalive
        run: |
          curl --fail-with-body -sS --max-time 30 \
            "$SUPABASE_URL/rest/v1/keepalive?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY"
